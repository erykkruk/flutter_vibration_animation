name: haptic_kit
description: >-
  Haptic feedback, vibration and animated haptic widgets for Flutter on Android
  and iOS: impact, notification, selection, custom waveforms and Core Haptics
  patterns.
version: 2.3.1

homepage: https://github.com/erykkruk/flutter_vibration_animation
repository: https://github.com/erykkruk/flutter_vibration_animation
issue_tracker: https://github.com/erykkruk/flutter_vibration_animation/issues
documentation: https://codigee.com/open-source/haptic-kit

screenshots:
  - description: PressAndHoldToConfirm with escalating haptic ticks.
    path: doc/media/press_and_hold.gif
  - description: Semantic haptics and composition primitives.
    path: doc/media/semantic_composition.gif

topics:
  - haptics
  - vibration
  - haptic-feedback
  - animation
  - widgets

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.erykkruk.haptic_kit
        pluginClass: HapticKitPlugin
      ios:
        pluginClass: HapticKitPlugin
        sharedDarwinSource: true
