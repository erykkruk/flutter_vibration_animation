name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  native-logic:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine restart tests
        run: |
          swiftc darwin/haptic_kit/Sources/haptic_kit/EngineRestartTracker.swift \
            test/native/engine_restart/main.swift \
            -o "$RUNNER_TEMP/engine_restart_test"
          "$RUNNER_TEMP/engine_restart_test"

  build-fresh-app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: ios, swiftpm: "true" }
          - { os: macos-latest, target: ios, swiftpm: "false" }
          - { os: ubuntu-latest, target: android, swiftpm: "false" }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash .github/scripts/build_fresh_app.sh ${{ matrix.target }} ${{ matrix.swiftpm }}
